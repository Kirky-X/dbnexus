[dependencies]
dbnexus = { path = "..", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "permission",
    "permission-engine",
    "sql-parser",
    "macros",
    "yaml",
    "config-toml",
    "config-env",
    "cache",
    "sharding",
    "global-index",
    "with-json",
    "with-time",
    "metrics",
    "audit",
    "migration",
    "auto-migrate",
    "health-check",
    "pool-health-check",
    "pool-warmup",
    "authentication",
    "validation",
    "duckdb",
    "tracing",
] }

# DuckDB crate（duckdb_query 示例需要直接使用 duckdb::types::Value）
duckdb = { version = "1.1", features = ["bundled"] }

# Async runtime
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

# Database
sea-orm = { version = "2.0.0-rc.37", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "^1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.33"

# Metrics
prometheus = "0.14"

# Async trait (kit_usage 示例需要)
async-trait = "0.1"

# Validation (macros_db_entity_v2 示例需要)
validator = { version = "0.20", features = ["derive"] }

[features]
default = []

# 抑制 check-cfg 误报：#[db_entity] 等宏展开后的 #[cfg(feature = "...")]
# 检查的是 dbnexus 依赖的特性，而非本 crate 的特性。这些特性已通过
# [dependencies].dbnexus.features 启用，但 rustc 的 check-cfg  lint
# 只检查本 crate 的 [features] 表，故产生误报告警。
[lints.rust]
unexpected_cfgs = "allow"
