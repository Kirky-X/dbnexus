[dependencies]
dbnexus = { path = "..", version = "0.6.0-rc.1", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "permission",
    "permission-engine",
    "sql-parser",
    "macros",
    "yaml",
    "config-toml",
    "config-env",
    "cache",
    "sharding",
    "global-index",
    "with-json",
    "with-time",
    "metrics",
    "audit",
    "migration",
    "auto-migrate",
    "health-check",
    "pool-health-check",
    "pool-warmup",
    "authentication",
    "validation",
    "duckdb",
    "neo4j",
    "oxcache-integration",
    "kit",
    "retry",
    "failover",
    "replica-routing",
    "scatter-gather",
    "shard-migration",
    "saga",
    "distributed-id",
] }

# DuckDB crate（duckdb_query 示例需要直接使用 duckdb::types::Value）
duckdb = { version = "1.1", features = ["bundled"] }

# Oxcache（oxcache_adapter 示例需要直接使用 oxcache 后端类型）
oxcache = { path = "../../oxcache", version = "0.5.0-rc.1" }

# trait-kit（kit 示例需要直接使用 AsyncKit DI 框架）
trait-kit = { path = "../../trait-kit", version = "0.5.0-rc.1", features = ["async", "lifecycle", "health"], default-features = false }

# JSON（图数据库示例需要 serde_json::json!）
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Time
chrono = { version = "0.4", features = ["serde"] }
time = { workspace = true }

# Database
sea-orm = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros"] }

# Serialization
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = "^1.1"

# Async trait (#[db_entity] 宏展开生成 #[::async_trait::async_trait]，需要直接依赖)
async-trait = "0.1"

# Validation (macros_db_entity_v2 示例需要)
validator = { workspace = true }

[features]
default = []

# 抑制 check-cfg 误报：#[db_entity] 等宏展开后的 #[cfg(feature = "...")]
# 检查的是 dbnexus 依赖的特性，而非本 crate 的特性。这些特性已通过
# [dependencies].dbnexus.features 启用，但 rustc 的 check-cfg  lint
# 只检查本 crate 的 [features] 表，故产生误报告警。
[lints.rust]
unexpected_cfgs = "allow"
