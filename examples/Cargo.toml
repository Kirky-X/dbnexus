[package]
name = "dbnexus-examples"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace]

[[bin]]
name = "quickstart"
path = "src/quickstart.rs"

[[bin]]
name = "config"
path = "src/config.rs"

[[bin]]
name = "permissions"
path = "src/permissions.rs"

[[bin]]
name = "transactions"
path = "src/transactions.rs"

[[bin]]
name = "sql_parser"
path = "src/sql_parser.rs"

[[bin]]
name = "permission_engine"
path = "src/permission_engine.rs"

[[bin]]
name = "entity_basic"
path = "src/entity_basic.rs"

[[bin]]
name = "security"
path = "src/security.rs"

[[bin]]
name = "metrics"
path = "src/metrics.rs"

[[bin]]
name = "tracing"
path = "src/tracing.rs"

[[bin]]
name = "audit"
path = "src/audit.rs"

[[bin]]
name = "cache"
path = "src/cache.rs"

[[bin]]
name = "sharding"
path = "src/sharding.rs"

[[bin]]
name = "migration"
path = "src/migration.rs"

[[bin]]
name = "global_index"
path = "src/global_index.rs"

[[bin]]
name = "macro_usage"
path = "src/macro_usage.rs"

[[bin]]
name = "authenticated_usage"
path = "src/authenticated_usage.rs"

[[bin]]
name = "health"
path = "src/health.rs"

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
dbnexus = { path = "..", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "permission",
    "permission-engine",
    "sql-parser",
    "macros",
    "config-yaml",
    "cache",
    "sharding",
    "global-index",
    "with-json",
    "metrics",
    "tracing",
    "audit",
    "migration",
    "health-check",
    "authentication",
] }

# Async runtime
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Database
sea-orm = { version = "2.0.0-rc.37", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.26"

# Metrics
prometheus = "0.14"

[features]
default = []
