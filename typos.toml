# typos 白名单 —— 仅登记「确为真词 / 真实标识符 / 刻意测试数据」的命中，
# 不放宽任何门禁：真正的拼写错误仍会由 typos 报告并阻断提交。
# 新增条目务必写明依据，禁止整目录/整文件排除。

[default]

# extend-ignore-identifiers-re: 标识符级白名单
# tests/security/unit/sql_injection_tests.rs: 混合大小写的 SQL 关键字
# "InFoRmAtIoN_ScHeMa" 是刻意的注入检测用例，大小写必须保留
# (typos 会把它按大小写切成 In|Fo|Rm|At|Io|N，故按标识符整体忽略)
extend-ignore-identifiers-re = ["(?i)InFoRmAtIoN"]

# extend-words: 单词级白名单(值等于键 = 该词永远合法)
[default.extend-words]
# docs/ARCHITECTURE.md: mermaid 节点 id，foundation 模块的惯用缩写
FND = "FND"
# src/access/sql_parser.rs#test_special_unicode_chars: 故意拆开的 "SEL\u{200B}ECT"，
# 用于验证零宽字符规范化，不可合并/改写
ECT = "ECT"
# src/database/pool/duckdb_conn.rs#test_duckdb_syntax_error_returns_error:
# 故意写错的 SQL 关键字，用于触发语法错误分支
TABL = "TABL"
# tests/ 与 src/ 内的语法错误用例："SELEC * FORM nonexistent" 等残缺 SQL
# （tests/mysql_testcontainers.rs、tests/postgres_testcontainers.rs、
# tests/pool/unit/duckdb_pool_tests.rs、src/access/security/ddl_guard.rs、
# src/access/sql_parser.rs、src/database/pool/session/tests.rs）
# 用于验证解析器与驱动的错误分支，属刻意构造的非法输入，不可"修正"
SELEC = "SELEC"
# src/i18n/i18n_impl.rs: ICU4X 组件 crate 的真实名字是 writeable（无 r），
# 源码 import 与依赖表中的引用均为真实标识符，不是 writable 的拼写错误
writeable = "writeable"
