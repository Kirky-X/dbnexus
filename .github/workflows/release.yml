name: Release

# tag 推送 → create-release（先行）→ publish-crates
# 主包 dbnexus 是库 crate（无 [[bin]]），通过 crates.io 发布，无需交叉编译二进制。
# dbnexus-cli 同样通过 crates.io 发布（cargo install dbnexus-cli 安装）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # 1. 创建 GitHub Release（先行，产出 upload_url 供后续 job 使用）
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Version: $VERSION"

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. 发布到 crates.io
  publish-crates:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates.io
      url: https://crates.io/crates/dbnexus
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish dbnexus-macros
        run: |
          cd macros
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty || echo "Already published or skipped"

      - name: Wait for index update
        run: sleep 15

      - name: Publish dbnexus
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty || echo "Already published or skipped"

      - name: Wait for index update
        run: sleep 15

      - name: Publish dbnexus-cli
        run: |
          cd src/tools/cli
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty || echo "Already published or skipped"

      - name: Verify publication
        run: |
          echo "✅ All crates published!"
          echo "📦 Check:"
          echo "  - https://crates.io/crates/dbnexus"
          echo "  - https://crates.io/crates/dbnexus-macros"
          echo "  - https://crates.io/crates/dbnexus-cli"
