name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates.io
      url: https://crates.io/crates/dbnexus
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Publish dbnexus-macros
        run: |
          cd macros
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "Already published or skipped"

      - name: Wait for index update
        run: sleep 15

      - name: Publish dbnexus
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "Already published or skipped"

      - name: Wait for index update
        run: sleep 15

      - name: Publish dbnexus-cli
        run: |
          cd src/tools/cli
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || echo "Already published or skipped"

      - name: Verify publication
        run: |
          echo "All crates published!"
          echo "Check:"
          echo "  - https://crates.io/crates/dbnexus"
          echo "  - https://crates.io/crates/dbnexus-macros"
          echo "  - https://crates.io/crates/dbnexus-cli"
