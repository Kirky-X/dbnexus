# lefthook 配置 — 7 仓库统一基线（与 .pre-commit-config.yaml 二选一启用）
# 启用: lefthook install
# 分工: 本文件负责提交期编译门禁（fmt/clippy/deny/私钥）与推送期 audit/覆盖率；
# 空白字符/YAML/TOML/typos/基线密钥扫描由 .pre-commit-config.yaml 覆盖
pre-commit:
  parallel: true
  commands:
    rustfmt-check:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      # 零告警门槛 feature 组合(与 CI clippy job 一致):
      # dbnexus 数据库驱动互斥(sqlite/duckdb 为 embedded,postgres/mysql 为 server-side),
      # 不能用 --all-features,按驱动分组: --features <db>,default-no-db,all-optional
      run: cargo clippy --all-targets --no-default-features --features sqlite,default-no-db,all-optional --workspace --exclude dbnexus-examples --exclude dbnexus-macros -- -D warnings
    cargo-deny:
      run: cargo deny check
    no-private-key:
      run: "! git diff --cached --name-only | xargs -r grep -IlE 'BEGIN (RSA|OPENSSH|PGP|EC|PRIVATE) PRIVATE KEY|sk-[A-Za-z0-9]{20,}'"

commit-msg:
  commands:
    conventional:
      run: 'grep -qE "^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert|style)(\(.+\))?!?: .+" {1}'

pre-push:
  commands:
    cargo-audit:
      run: cargo audit
    coverage-95:
      name: coverage ≥95% lines
      # 与 CI coverage job 同口径（sqlite,default-no-db,all-optional）——
      # 此前裸 default(=[]) 统计的是零 feature 空壳，门槛形同虚设。
      run: cargo llvm-cov --no-default-features --features sqlite,default-no-db,all-optional --workspace --exclude dbnexus-cli --exclude dbnexus-macros --exclude dbnexus-examples --fail-under-lines 95
