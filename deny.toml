# cargo-deny 配置文件
# 文档: https://embarkstudios.github.io/cargo-deny/

[advisories]
yanked = "warn"
unmaintained = "transitive"
ignore = [
    # proc-macro-error2 (RUSTSEC-2026-0173) — 已移除该依赖（2026-08 改用 syn::Error），advisory 不再出现
    # cxx unsound (RUSTSEC-2026-0202) — 已随 proc-macro-error2 移除而不再出现于依赖树
    # （2026-08 移除 proc-macro-error2 后 advisory-not-detected，清理此 ignore）
    # neo4rs 传递依赖 unmaintained（2026-08 核实，均为 neo4rs → 传递引入）：
    #   RUSTSEC-2025-0012 (backoff) — neo4rs 依赖，无安全升级路径
    #   RUSTSEC-2024-0384 (instant) — backoff → instant，无安全升级路径
    #   RUSTSEC-2024-0436 (paste) — neo4rs 依赖，可用 pastey 替代但需 neo4rs 侧迁移
    #   RUSTSEC-2025-0134 (rustls-pemfile) — neo4rs/rustls-native-certs 依赖，建议迁移至 rustls-pki-types
    # 待 neo4rs 上游迁移后自然消除
    "RUSTSEC-2025-0012",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
