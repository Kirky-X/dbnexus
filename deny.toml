# cargo-deny 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# `cargo deny check` 校验 漏洞/许可证/禁用源/重复依赖。
# 完整字段见: https://embarkstudios.github.io/cargo-deny/
# 仓库特有豁免写在 [advisories].ignore 与 [[licenses.exceptions]],须附原因注释。

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
# 按仓库填:传递依赖 RUSTSEC 豁免(每项须注释原因)
ignore = [
    # neo4rs 传递依赖 unmaintained(2026-08 核实,均为 neo4rs → 传递引入):
    #   RUSTSEC-2025-0012 (backoff) — neo4rs 依赖,无安全升级路径
    #   RUSTSEC-2024-0384 (instant) — backoff → instant,无安全升级路径
    #   RUSTSEC-2024-0436 (paste) — neo4rs 依赖,可用 pastey 替代但需 neo4rs 侧迁移
    #   RUSTSEC-2025-0134 (rustls-pemfile) — neo4rs/rustls-native-certs 依赖,建议迁移至 rustls-pki-types
    # 待 neo4rs 上游迁移后自然消除
    "RUSTSEC-2025-0012",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0134",
]

[licenses]
# 允许的宽松许可证;新增非宽松许可证需在此放行
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
# 7 仓统一 license：MIT + Commons Clause v1.0（license-file 形态，见 base/CONFIG_BASELINE.md）。
# cargo-deny 不识别 manifest 的 license-file 且 allow 不接受 LicenseRef-*，
# 对本地工作区 crate 用 clarify 绑定 LICENSE 文件内容 hash（防篡改）并按文件内
# MIT 主文识别放行；Commons Clause 商用限制由 LICENSE 文件本身承载
# （六仓 LICENSE 内容一致同 hash，confers 仅版权年份差异）
confidence-threshold = 0.8
unused-allowed-license = "warn"

[[licenses.clarify]]
name = "dbnexus"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xfb13e7ad }]

[[licenses.clarify]]
name = "dbnexus-macros"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0xfb13e7ad }]

[[licenses.clarify]]
name = "oxcache"
expression = "MIT"
license-files = [{ path = "../oxcache/LICENSE", hash = 0xfb13e7ad }]

[[licenses.clarify]]
name = "trait-kit"
expression = "MIT"
license-files = [{ path = "../trait-kit/LICENSE", hash = 0xfb13e7ad }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
name = "serde_yaml" # deprecated, use serde_yaml_ng
wrappers = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
