# cargo-deny 配置文件
# 文档: https://embarkstudios.github.io/cargo-deny/

[advisories]
yanked = "warn"
unmaintained = "transitive"
ignore = [
    # proc-macro-error2 unmaintained (RUSTSEC-2026-0173) — transitive via sea-orm-macros (sea-bae)
    # 无安全升级路径，等待 sea-orm 生态迁移
    "RUSTSEC-2026-0173",
    # cxx unsound (RUSTSEC-2026-0202) — let_cxx_string! 使用未初始化值（异常安全）
    # 不可触发证据（2026-07 核实）：
    #   1. cxx 由 lbug(optional, ladybug feature) 传递引入；dbnexus `default = []` 不启用 ladybug
    #   2. lbug 0.18.2 crate 源码未使用 let_cxx_string! / cxx::bridge 宏
    #   3. 触发路径为死代码；dbnexus src/ 无任何 cxx 用法
    # 待 cargo-deny advisory-db 同步此条后此 ignore 生效；当前 db 未收录故不报
    "RUSTSEC-2026-0202",
    # neo4rs 传递依赖 unmaintained（2026-08 核实，均为 neo4rs → 传递引入）：
    #   RUSTSEC-2025-0012 (backoff) — neo4rs 依赖，无安全升级路径
    #   RUSTSEC-2024-0384 (instant) — backoff → instant，无安全升级路径
    #   RUSTSEC-2024-0436 (paste) — neo4rs 依赖，可用 pastey 替代但需 neo4rs 侧迁移
    #   RUSTSEC-2025-0134 (rustls-pemfile) — neo4rs/rustls-native-certs 依赖，建议迁移至 rustls-pki-types
    # 待 neo4rs 上游迁移后自然消除
    "RUSTSEC-2025-0012",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0134",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
