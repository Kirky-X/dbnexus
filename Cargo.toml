[workspace]
members = [
    ".",
    "macros",
    "src/tools/cli",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/Kirky-X/dbnexus"
documentation = "https://docs.rs/dbnexus"
keywords = ["database", "orm", "sea-orm", "sql"]
categories = ["database", "asynchronous"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"

# Database - 使用最新的 prerelease 版本，不包含数据库驱动，由各子包自行选择
sea-orm = { version = "2.0.0-rc.37", default-features = false }

# Time
time = { version = "0.3", features = ["formatting", "parsing"] }

# Caching - 基于 oxcache 的缓存系统

# Internal packages
dbnexus-macros = { path = "macros", version = "=0.3.0" }

[workspace.lints.rust]

[workspace.lints.clippy]
# 允许测试中多次引用 common 模块
duplicate_mod = "allow"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package]
name = "dbnexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "An enterprise-grade database abstraction layer for Rust with built-in permission control and connection pooling"
# 禁用 examples 自动发现：examples/ 目录下存在独立的 dbnexus-examples crate（含自有 Cargo.toml），
# 其 src/*.rs 文件不应被主包自动识别为示例。所有示例由 dbnexus-examples 子 crate 独立管理。
autoexamples = false

[features]
default = [
    "runtime-tokio-rustls",
    "sqlite",
    "permission",
    "sql-parser",
    "macros",
    "config-env",
    "with-time",
]

# === 运行时 (互斥 - 必须且只能选一个) ===
runtime-tokio-rustls = [
    "sea-orm/runtime-tokio-rustls",
    "tokio/rt-multi-thread",
    "tokio/fs",
]
runtime-tokio-native-tls = [
    "sea-orm/runtime-tokio-native-tls",
    "tokio/rt-multi-thread",
    "tokio/fs",
]
runtime-async-std = [
    "sea-orm/runtime-async-std",
]

# === 数据库驱动 (互斥 - 必须且只能选一个) ===
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm/macros"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm/macros"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm/macros"]

# === 核心功能 (可选) ===
permission = ["dashmap", "futures", "yaml"]  # 权限控制（dashmap 用于旧版 access/permission，yaml 用于策略解析，futures 用于测试）
# Task 21：移除 permission-with-cache 聚合 feature（纯别名，无独占代码）
# 启用带缓存的权限控制请使用：permission + cache
sql-parser = ["sqlparser", "cache", "once_cell", "regex", "unicode-normalization"]
macros = ["dbnexus-macros"]
cache = ["oxcache"]  # 缓存功能（基于 oxcache）

# === 配置支持 ===
yaml = ["serde_yaml_ng"]  # YAML 配置支持（Task 21：合并原 config-yaml 别名）
config-toml = ["toml"]
config-env = []  # 环境变量配置（无额外依赖）
json = []  # JSON 支持（用于直接 serde_json 反序列化）

# === 连接池增强 ===
pool-health-check = ["futures"]  # 连接池健康检查
pool-warmup = ["futures"]  # 连接池预热

# === 可观测性 ===
observability = ["metrics", "health-check", "tracing"]
metrics = []  # Prometheus 格式 metrics 导出（内置实现，无需外部 crate）
health-check = []  # 健康检查模块（内置，无额外依赖）
tracing = ["dep:tracing", "dep:tracing-opentelemetry", "dep:tracing-subscriber", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

# === 数据管理 ===
data-management = ["migration", "auto-migrate", "sharding", "global-index"]
migration = ["sqlparser", "regex"]  # 数据库迁移
auto-migrate = ["migration"]  # 自动迁移
sharding = ["twox-hash", "chrono", "futures"]  # 数据分片
global-index = ["chrono", "with-json"]  # 全局索引
with-json = ["sea-orm/with-json"]  # JSON 支持（global-index 需要）
with-time = ["sea-orm/with-time"]  # time crate 支持（timestamps 功能需要）
validation = ["validator", "with-time"]  # 数据验证（validator crate + timestamps 依赖）

# === 安全与合规 ===
security = ["audit", "permission-engine"]
audit = ["chrono", "uuid"]  # 审计日志
permission-engine = ["dashmap", "cache", "futures", "once_cell", "regex"]  # 高级权限引擎
authentication = ["jsonwebtoken", "bcrypt"]  # JWT 认证系统

# === 开发工具 ===
dev = []
dev-full = ["dev", "bench", "test-utils"]
bench = ["criterion"]  # 性能测试相关依赖
test-utils = ["tempfile", "assert_cmd"]  # 测试辅助工具
cli-tests = []

# === 预设配置 ===
# 嵌入式/边缘设备 - 超轻量配置
embedded = ["runtime-tokio-rustls", "sqlite", "config-env"]

# 微服务 - 优化的配置
microservice = [
    "runtime-tokio-rustls",
    "postgres",
    "permission",
    "sql-parser",
    "config-env",
    "observability",
]

# 单体应用 - 完整配置
monolith = [
    "runtime-tokio-rustls",
    "postgres",
    "permission",
    "sql-parser",
    "yaml",
    "data-management",
    "security",
    "observability",
]

# 企业级 - 全功能配置
enterprise = ["postgres", "monolith", "permission-engine"]

# 所有可选功能（不包括数据库驱动）
all-optional = ["cache", "observability", "data-management", "security", "migration"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
serde_json = { workspace = true }
sea-orm = { workspace = true, default-features = false }
time = { workspace = true }
toml = { version = "^1.1", optional = true }
parking_lot = "0.12"
chrono = { version = "0.4", optional = true, features = ["serde"] }
once_cell = { version = "1.21", optional = true }
twox-hash = { version = "2.1", optional = true }
url = "2.5"
async-trait = "0.1"
uuid = { version = "1.22", optional = true, features = ["v4"] }
validator = { version = "0.20", optional = true, features = ["derive"] }
criterion = { version = "0.5", optional = true }

# External dependencies
regex = { version = "1.0", optional = true }
sqlparser = { version = "0.47", optional = true }
futures = { version = "0.3", optional = true }
dashmap = { version = "~6.2", optional = true }
# Cache via oxcache - moka is used internally by oxcache as L1 backend
oxcache = { version = "0.2.0", optional = true }
trait-kit = "0.1.0"

# Authentication dependencies
jsonwebtoken = { version = "~10.0", features = ["rust_crypto"], optional = true }
bcrypt = { version = "~0.19", optional = true }

unicode-normalization = { version = "0.1", optional = true }

# Tracing / OpenTelemetry（tracing feature）
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", optional = true, features = ["tonic"] }

# Internal packages
dbnexus-macros = { workspace = true, optional = true }

# Testing utilities (also in dev-dependencies)
assert_cmd = { version = "2.2", optional = true }
tempfile = { version = "3.27", optional = true }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
criterion = "0.5"
tempfile = "3.27"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "core_entity_integration"
path = "tests/core/integration/entity_integration.rs"
required-features = ["macros", "sqlite"]
# 注意：这个测试支持多种数据库，但 required-features 只能指定一个
# 当使用 postgres/mysql 特性运行时，SQLite 仍会被编译，但测试会正确选择数据库

[[test]]
name = "core_sql_parser_integration"
path = "tests/core/integration/sql_parser_integration.rs"
required-features = ["sql-parser", "permission"]

[[test]]
name = "core_session_transaction"
path = "tests/core/integration/session_transaction.rs"
required-features = ["permission"]

[[test]]
name = "core_permission_integration"
path = "tests/core/integration/permission_integration.rs"
required-features = ["permission", "cache", "test-utils", "permission-engine"]

[[test]]
name = "audit_integration"
path = "tests/audit/integration/audit_integration.rs"
required-features = ["audit"]

[[test]]
name = "audit_unit_tests"
path = "tests/audit/unit/audit_unit_tests.rs"
required-features = ["audit"]

[[test]]
name = "migration_integration"
path = "tests/migration/integration/integration.rs"
required-features = ["migration", "auto-migrate"]

[[test]]
name = "migration_auto_migrate"
path = "tests/migration/integration/auto_migrate.rs"
required-features = ["auto-migrate"]

[[test]]
name = "migration_schema_macro"
path = "tests/migration/integration/schema_macro_test.rs"
required-features = ["macros", "migration", "sqlite"]

[[test]]
name = "migration_query_builder"
path = "tests/migration/integration/query_builder_test.rs"
required-features = ["macros", "migration", "sqlite"]

[[test]]
name = "migration_timestamps"
path = "tests/migration/integration/timestamps_test.rs"
required-features = ["macros", "migration", "sqlite"]

[[test]]
name = "migration_soft_delete"
path = "tests/migration/integration/soft_delete_test.rs"
required-features = ["macros", "migration", "sqlite"]

[[test]]
name = "migration_validation"
path = "tests/migration/integration/validation_test.rs"
required-features = ["macros", "migration", "sqlite", "validation"]

[[test]]
name = "migration_hooks"
path = "tests/migration/integration/hooks_test.rs"
required-features = ["macros", "migration", "sqlite"]

[[test]]
name = "sharding_integration"
path = "tests/sharding/integration/sharding_integration.rs"
required-features = ["sharding"]

[[test]]
name = "metrics_integration"
path = "tests/metrics/integration/metrics_integration.rs"
required-features = ["metrics"]

[[test]]
name = "permission_engine_integration"
path = "tests/permission/integration/permission_engine_integration.rs"
required-features = ["permission-engine"]

[[test]]
name = "cross_cutting_benchmarks"
path = "tests/cross_cutting/benchmarks/bench.rs"
required-features = ["permission"]

[[test]]
name = "cross_cutting_cli"
path = "tests/cross_cutting/cli/cli_integration.rs"
required-features = ["cli-tests"]

[[test]]
name = "cross_cutting_concurrency"
path = "tests/cross_cutting/integration/concurrency.rs"
required-features = ["permission"]

[[test]]
name = "cross_cutting_multi_db"
path = "tests/cross_cutting/integration/multi_db.rs"
required-features = ["migration"]

# Docker testcontainers 集成测试 - PostgreSQL（需要 Docker 环境）
[[test]]
name = "postgres_testcontainers"
path = "tests/postgres_testcontainers.rs"
required-features = ["postgres"]

# Docker testcontainers 集成测试 - MySQL（需要 Docker 环境）
[[test]]
name = "mysql_testcontainers"
path = "tests/mysql_testcontainers.rs"
required-features = ["mysql"]

[[bench]]
name = "permission_bench"
path = "benches/permission_bench.rs"
harness = false

# tests/mod.rs 需要 sqlite 特性才能正确运行
# 因为 entity_integration 测试使用硬编码的 sqlite::memory: 连接
[[test]]
name = "mod"
path = "tests/mod.rs"
required-features = ["sqlite", "test-utils", "futures"]

# Pool semaphore test
[[test]]
name = "pool_semaphore_test"
path = "tests/pool_semaphore_test.rs"
required-features = ["sqlite", "futures"]

# Security tests - SQL injection detection tests
[[test]]
name = "security_unit_tests"
path = "tests/security/unit/sql_injection_tests.rs"
required-features = ["sql-parser"]

# Pool 单元测试 - Session 生命周期、事务、execute_raw
[[test]]
name = "pool_session_unit_tests"
path = "tests/pool/unit/session_unit_tests.rs"
required-features = ["sqlite", "permission", "sql-parser"]

# Pool 单元测试 - DbPool 构造、status、get_session 权限
[[test]]
name = "pool_db_pool_unit_tests"
path = "tests/pool/unit/db_pool_unit_tests.rs"
required-features = ["sqlite", "permission"]

# Core 单元测试 - 配置类型（DbConfig、CacheConfig、DatabaseType）
[[test]]
name = "core_config_unit_tests"
path = "tests/core/unit/config_unit_tests.rs"

# Core 单元测试 - 公共类型（DatabaseType、DbNexusError）
[[test]]
name = "core_common_types_tests"
path = "tests/core/unit/common_types_tests.rs"

# Domain 单元测试 - 权限模块（PermissionConfig、RolePolicy、MemoryPermissionProvider）
[[test]]
name = "domain_permission_tests"
path = "tests/domain/permission_test.rs"
required-features = ["permission"]

# Tracing 单元测试 - TracingGuard init/重复初始化安全/TracingError Display
[[test]]
name = "tracing_unit_tests"
path = "tests/tracing/unit/tracing_unit_tests.rs"
required-features = ["tracing"]

# Tracing 集成测试 - TracingGuard drop + Session span 自动创建
[[test]]
name = "tracing_integration"
path = "tests/tracing/integration/tracing_integration.rs"
required-features = ["tracing", "sqlite", "permission"]

[dev-dependencies.testcontainers]
version = "0.23"

# ============================================================================
# 示例管理说明
# ============================================================================
# 所有示例由独立的 dbnexus-examples crate（examples/Cargo.toml）管理，
# 其二进制文件通过 [[bin]] 注册，不在此处注册 [[example]]。
# autoexamples = false 已在 [package] 中设置，防止 Cargo 自动发现 examples/src/*.rs。
