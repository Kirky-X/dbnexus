[workspace]
members = [
    ".",
    "macros",
    "limiter-port",
    "src/tools/cli",
    "examples",
]
resolver = "2"

[workspace.package]
version = "0.6.0-rc.6"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "MIT"
repository = "https://github.com/Kirky-X/dbnexus"
documentation = "https://docs.rs/dbnexus"
keywords = ["database", "orm", "sea-orm", "sql"]
categories = ["database", "asynchronous"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"

# Database - 不包含数据库驱动，由各子包自行选择
sea-orm = { version = "2.0", default-features = false }

# Time
time = { version = "0.3", features = ["formatting", "parsing"] }

# Caching - 基于 oxcache 的缓存系统

# Internal packages
dbnexus-macros = { path = "macros", version = "0.6.0-rc.6" }
# 限流端口（层级抽取，防 dbnexus↔limiteron 包级循环依赖；limiteron 可无 dbnexus 依赖实现本端口）
dbnexus-limiter-port = { path = "limiter-port", version = "0.6.0-rc.6" }

# Validation（root + examples 共享）
validator = { version = "0.21", features = ["derive"] }

# HTTP 健康端点（http-health feature 生成 axum Router，server 能力交给消费方）
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }

[workspace.lints.rust]
# 宏（#[db_entity]/#[db_repository]）展开后会在消费方代码中生成
# #[cfg(feature = "metrics")] 指标插桩，检查的是 dbnexus 的特性而非本 crate 的
# [features] 表，rustc check-cfg lint 只认本 crate [features]，故把宏发射的
# feature 名补记为预期值；其余 feature cfg 仍按各 crate 自身 [features] 以 warn
# 级校验（保留拼写错误检出能力，宏发射名单见 macros/src 中 cfg(feature = ...)）。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("metrics"))'] }

[workspace.lints.clippy]
# 允许测试中多次引用 common 模块
duplicate_mod = "allow"

[package]
name = "dbnexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "An enterprise-grade database abstraction layer for Rust with built-in permission control and connection pooling"
# 禁用 examples 自动发现：examples/ 目录下存在独立的 dbnexus-examples crate（含自有 Cargo.toml），
# 其 src/*.rs 文件不应被主包自动识别为示例。所有示例由 dbnexus-examples 子 crate 独立管理。
autoexamples = false

[features]
# ⚠️ 驱动互斥（严格，无逃生门）：embedded（sqlite/duckdb）与 server-side（postgres/mysql）
# 任何混合（含 --all-features 全开）一律编译失败。多后端 crate 不适用 --all-features
# 验证（Cargo 无 feature 互斥语法），请按驱动分组启用 features 验证。
# Rule 6: default features 最小化 — 所有依赖通过显式 features 启用。
# 与 oxcache/inklog/sdforge 保持一致（default = []）。
# 使用者需显式启用 runtime + 数据库驱动 + 所需功能特性。
# CI 使用 `--no-default-features --features <db>,default-no-db,all-optional`。
default = []

# default without database driver — for CI matrix testing where
# the database backend is selected via --features <db>,default-no-db
# Provides a convenience aggregate for the common non-driver feature set.
default-no-db = [
    "runtime-tokio-rustls",
    "permission",
    "sql-parser",
    "macros",
    "config-env",
    "with-time",
]

# === 运行时 (互斥 - 必须且只能选一个) ===
runtime-tokio-rustls = [
    "sea-orm/runtime-tokio-rustls",
    "tokio/rt-multi-thread",
    "tokio/fs",
]
runtime-tokio-native-tls = [
    "sea-orm/runtime-tokio-native-tls",
    "tokio/rt-multi-thread",
    "tokio/fs",
]
# 实现状态：tokio 为非可选核心依赖恒开（见 [workspace.dependencies]），本 feature
# 仅转发 sea-orm 的 async-std 运行时支持，dbnexus 自身仍构建于 tokio 之上。
runtime-async-std = [
    "sea-orm/runtime-async-std",
]

# === 数据库驱动 (互斥 - 必须且只能选一个) ===
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm/macros"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm/macros"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm/macros"]
duckdb = ["dep:duckdb", "sea-orm/macros"]  # 嵌入式分析型数据库（0.3.0 新增；sea-orm/macros 供 global-index 等 derive 实体编译）
# Graph database drivers (can coexist with relational drivers per design 2.8)
ladybug = ["dep:lbug"]   # 嵌入式图数据库（Ladybug，原 Kuzu）
neo4j = ["dep:neo4rs"]   # Neo4j 图数据库服务器

# === 核心功能 (可选) ===
permission = ["dashmap", "futures", "yaml", "sql-parser", "arc-swap", "cache", "dep:dbnexus-limiter-port"]  # 权限控制（强制依赖 sql-parser 防止 SQL 注入绕过；dashmap 用于 access/permission，yaml 用于策略解析，futures 用于测试，arc-swap 用于无锁配置读取；cache 为 DbPool 权限策略缓存的显式依赖——sql-parser 已解耦不再传递携带；dbnexus-limiter-port 为限流端口——旧令牌桶实现端口保持默认后端，外部限流后端（limiteron 等）经端口注入）
# 移除 permission-with-cache 聚合 feature（纯别名，无独占代码）
# 启用带缓存的权限控制请使用：permission + cache
# sql-parser 自带解析结果缓存（prepare_cache 同步 LRU 端口），不隐含 cache→oxcache
sql-parser = ["sqlparser", "regex", "unicode-normalization", "sea-orm/with-json"]
data-protection = ["dep:sha2"]  # 字段脱敏与行级安全
config-confers = ["dep:confers", "confers/change-stream", "permission"]  # confers 配置热重载
macros = ["dbnexus-macros"]
cache = ["dep:oxcache", "arc-swap", "cache-available"]  # 缓存功能（基于 oxcache；arc-swap 用于无锁 cache_provider 读取）

# trait-kit 0.4 AsyncKit integration (DbNexusModule). Pulls in trait-kit
# with the `async` feature only — default features are disabled (Rule 6).
# `oxcache-integration` enables the OxcacheDbCacheAdapter 与 OxcacheQueryCache
# 查询缓存装饰器（key 派生需 sha2）；`kit` adds the DbNexusModule that wires
# OxcacheModule's capability into a DbPool.
# Mirrors oxcache/limiteron `kit` feature pattern.
oxcache-integration = ["dep:oxcache", "arc-swap", "cache-available", "dep:sha2"]
# 内部谓词：缓存能力可用（oxcache 后端或 DI 注入）。cache 与 oxcache-integration
# 均隐含本 feature，池/会话代码统一以此判定缓存能力，避免重复 any(...) 组合。
cache-available = []
# kit 隐含全部能力 feature 闭包（池/缓存/审计/健康），注册即全能力可 require
kit = ["dep:trait-kit", "oxcache-integration", "oxcache/kit", "trait-kit/lifecycle", "trait-kit/health", "trait-kit/observer", "audit", "sql-parser", "health-check"]

# === 配置支持 ===
yaml = ["serde_yaml_ng"]  # YAML 配置支持（合并原 config-yaml 别名）
config-toml = []  # TOML 配置支持（无额外依赖，用户需自行添加 toml crate）
config-env = []  # 环境变量配置（无额外依赖）

# === 连接池增强 ===
pool-health-check = ["futures"]  # 连接池健康检查
pool-warmup = ["futures"]  # 连接池预热

# === 可观测性 ===
observability = ["metrics", "health-check"]
metrics = ["dep:parking_lot"]  # Prometheus 格式 metrics 导出（parking_lot 用于 MetricsCollector 内部 RwLock）
health-check = []  # 健康检查模块（内置，无额外依赖）
otel = ["health-check"]  # OTel 导出桥（慢查询/池指标 → OTLP/HTTP + stdout fallback，手工 HTTP 客户端无新增依赖）
# HTTP 健康端点生成器：`HealthRouterBuilder` 产出挂载 /healthz /readyz /metrics
# 的 axum Router（liveness/readiness/Prometheus 三分语义）；仅生成 Router 不含
# serve，默认不引入任何 HTTP 依赖，启用本 feature 才拉入 axum（server 能力
# 留给消费方挂载）。数据源 health_snapshot + 可选 CircuitBreaker/MetricsCollector
http-health = ["dep:axum", "health-check"]

# === 数据管理 ===
data-management = ["migration", "auto-migrate", "sharding", "global-index"]
migration = ["sqlparser", "regex"]  # 数据库迁移
auto-migrate = ["migration"]  # 自动迁移
sharding = ["twox-hash", "chrono", "futures", "dashmap"]  # 数据分片（dashmap 用于分片连接池并发管理）
global-index = ["chrono", "with-json", "entity-macros"]  # 全局索引（实体 derive 经 entity-macros 转发，无驱动组合可用）
with-json = ["sea-orm/with-json"]  # JSON 支持（global-index 需要）
with-time = ["sea-orm/with-time"]  # time crate 支持（timestamps 功能需要）
with-chrono = ["sea-orm/with-chrono", "chrono"]  # chrono 类型支持（DateTime/NaiveDateTime 字段）
with-uuid = ["sea-orm/with-uuid", "dep:uuid"]  # UUID 类型支持（uuid::Uuid 字段）
validation = ["validator", "with-time"]  # 数据验证（validator crate + timestamps 依赖）
# sea-orm MockDatabase 转发（仅测试用；经 dbnexus::sea_orm re-export 使用 MockDatabase
# 的消费方开启此 feature，避免为 MockDatabase 保留 sea-orm 直依赖）
mock = ["sea-orm/mock"]
# sea-orm 派生宏转发（entity::prelude 的 DeriveEntityModel/DeriveRelation/FromQueryResult
# 等 derive 均由 sea-orm 的 macros feature 门控；经 dbnexus::sea_orm re-export 定义实体/
# 查询行的消费方开启此 feature，避免为派生宏保留 sea-orm 直依赖；与驱动 feature 正交）
entity-macros = ["sea-orm/macros"]

# === 分布式能力 ===
retry = ["sql-parser", "dep:rand"]  # 运行时重试 + 指数退避（需要 sql-parser 判断幂等性，rand 用于 jitter）
failover = ["pool-health-check"]  # 连接故障转移（CircuitBreaker + HealthCheck 协同）
replica-routing = []  # 副本路由（基于复制 lag 检测的读写分离）
scatter-gather = ["sharding"]  # 跨分片查询引擎（scatter-gather 执行器）
# 批量写入：COPY 封装（语句构建 + text/CSV 行编码；协议传输经 #cfg(feature="postgres")
# 门控，DuckDB 文件 COPY 传输经 #cfg(feature="duckdb") 门控）+ 多值 INSERT 构建
# （batch_insert，500 行分块参数化）。取舍：copy 保持零依赖（[]）——postgres/duckdb
# 是互斥驱动 feature，本 feature 不绑定任何驱动，传输路径按驱动 cfg 双门控，避免
# feature 互斥矩阵爆炸；无驱动组时仅编译语句构建/编码纯函数，copy_in 显式报错。
copy = []
repository = []  # 泛型仓储 Repository<T> CRUD 端口（DbPool JSON 行参考实现 + impl_json_repository! 宏）
data-api = ["repository"]  # 数据 API 网关雏形（实体→JSON 查询端点生成器，供 sdforge 集成）
prepare-cache = []  # 语句级 prepared statement LRU 缓存（池级就绪标记 + 命中率指标）
permission-facade = ["permission", "data-protection"]  # 权限统一门面（RBAC+脱敏+RLS 单一入口）
query-dsl = []  # 查询 DSL 宏 q!（类型安全查询片段：ident 列引用 + literal 值 + AND 条件组合）
entity-events = ["repository"]  # 实体事件总线 + Outbox（复用仓储标识符/字面量工具 + 变更事件持久化 + 后台投递 + 总线消费）
shard-migration = ["migration", "sharding"]  # 分片迁移编排
saga = ["sharding", "dep:uuid"]  # 分布式事务 Saga 编排器
distributed-id = []  # 分布式 ID 生成器（Snowflake 默认实现）
distributed-capabilities = ["retry", "failover", "replica-routing", "scatter-gather", "shard-migration", "saga", "distributed-id"]  # 分布式能力聚合 feature

# === 安全与合规 ===
security = ["audit", "permission-engine"]
audit = ["chrono", "dep:uuid"]  # 审计日志
permission-engine = ["dashmap", "cache", "futures", "regex", "permission"]  # 高级权限引擎（依赖 permission 提供基础权限类型）
authentication = ["jsonwebtoken", "bcrypt"]  # JWT 认证系统

# === 开发工具 ===
# bench 已删除：criterion 经 [dev-dependencies] 提供（benches 不经 feature 启用），
# 原 optional 依赖从未被任何代码路径激活。
dev-full = ["test-utils"]
test-utils = ["tempfile", "assert_cmd"]  # 测试辅助工具
cli-tests = []

# === 预设配置 ===
# 嵌入式/边缘设备 - 超轻量配置
embedded = ["runtime-tokio-rustls", "sqlite", "config-env"]

# 微服务 - 优化的配置
microservice = [
    "runtime-tokio-rustls",
    "postgres",
    "permission",
    "sql-parser",
    "config-env",
    "observability",
]

# 单体应用 - 完整配置
monolith = [
    "runtime-tokio-rustls",
    "postgres",
    "permission",
    "sql-parser",
    "yaml",
    "data-management",
    "security",
    "observability",
    "retry",
    "failover",
    "replica-routing",
    "scatter-gather",
    "shard-migration",
    "saga",
    "distributed-id",
]

# 企业级 - 全功能配置
enterprise = ["postgres", "monolith", "permission-engine"]

# 所有可选功能（不包括数据库驱动；成员均无 embedded/server 驱动互斥风险）
all-optional = ["cache", "observability", "data-management", "security", "migration", "retry", "failover", "replica-routing", "scatter-gather", "shard-migration", "saga", "distributed-id", "repository", "data-api", "prepare-cache", "validation", "authentication", "query-dsl", "entity-events", "permission-facade", "config-confers", "copy", "otel", "kit", "data-protection", "http-health"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
serde_json = { workspace = true }
sea-orm = { workspace = true, default-features = false }
time = { workspace = true }
axum = { workspace = true, optional = true }
parking_lot = { version = "0.12", optional = true }
chrono = { version = "0.4", optional = true, features = ["serde"] }
sha2 = { version = "0.11", optional = true }
confers = { version = "0.6.0-rc.6", default-features = false, optional = true }
twox-hash = { version = "2.1", optional = true }
url = "2.5"
async-trait = "0.1"
uuid = { version = "1.26", optional = true, features = ["v4"] }
validator = { workspace = true, optional = true }

# External dependencies
# 结构化日志门面：池超时/权限拒绝/熔断/慢查询接线点经 log 宏发记录；
# 未安装 logger 时为 no-op，默认构建行为不变。具体后端（如 inklog
# LoggerManager）由消费方自行安装，dbnexus 不依赖任何日志后端 crate。
log = { version = "0.4", default-features = false, features = ["std"] }
regex = { version = "1.13", optional = true }
sqlparser = { version = "0.63", optional = true }
futures = { version = "0.3", optional = true }
dashmap = { version = "6.2", optional = true }
# Lock-free read for permission config (COW pattern)
arc-swap = { version = "1.9", optional = true }
# Cache via oxcache - moka is used internally by oxcache as backend.
oxcache = { version = "0.5.0-rc.6", optional = true }

# Rate limiter port（限流端口，permission feature 专用；独立小 crate 防 dbnexus↔limiteron 循环依赖）
dbnexus-limiter-port = { workspace = true, optional = true }

# trait-kit integration (optional, feature-gated via `kit`).
# Mirrors oxcache/limiteron pattern.
trait-kit = { version = "0.5.0-rc.7", default-features = false, features = ["async"], optional = true }

# DuckDB embedded database (duckdb feature, 0.3.0 new)
duckdb = { version = "1.10505", optional = true, features = ["bundled"] }

# Ladybug embedded graph database (ladybug feature, 0.4.0 new)
lbug = { version = "0.20", optional = true }
# Neo4j graph database server (neo4j feature, 0.4.0 new)
neo4rs = { version = "0.9.0-rc.10", optional = true }

# Authentication dependencies
# jsonwebtoken: v11 使用 aws_lc_rs 后端，API 与 v10 兼容
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"], optional = true }
bcrypt = { version = "0.19", optional = true }

unicode-normalization = { version = "0.1", optional = true }
rand = { version = "0.10", optional = true }

# ICU4X 国际化（核心特性，始终可用）
icu = { version = "2.3", default-features = false, features = ["compiled_data"] }
writeable = "0.6"
sys-locale = "0.3"
fluent-bundle = "0.16"
unic-langid = "0.9"


# Internal packages
dbnexus-macros = { workspace = true, optional = true }

# Testing utilities (also in dev-dependencies)
assert_cmd = { version = "2.2", optional = true }
tempfile = { version = "3.27", optional = true }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
criterion = "0.8"
tempfile = "3.27"
futures = "0.3"
# http-health 端点契约测试：tower ServiceExt::oneshot 直测 Router（不起真实服务器）
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true

# docs.rs 显式清单：仅启用 sqlite 单一驱动 + 无互斥风险的功能 feature。
# 不能用 all-features = true——embedded（sqlite/duckdb）与 server-side
# （postgres/mysql）混用会触发 src/lib.rs 的编译期互斥 compile_error，
# rustdoc 的 not(clippy) 门控不约束 rustdoc，docs.rs 构建必失败。
[package.metadata.docs.rs]
features = ["default-no-db", "sqlite", "cache", "metrics", "health-check", "migration", "kit"]
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "core_entity_integration"
path = "tests/core/integration/entity_integration.rs"
required-features = ["macros", "sqlite"]
# 注意：这个测试支持多种数据库，但 required-features 只能指定一个
# 当使用 postgres/mysql 特性运行时，SQLite 仍会被编译，但测试会正确选择数据库

[[test]]
name = "core_sql_parser_integration"
path = "tests/core/integration/sql_parser_integration.rs"
required-features = ["sql-parser", "permission"]

[[test]]
name = "core_session_transaction"
path = "tests/core/integration/session_transaction.rs"
# sqlite：全部用例经 common helper 依赖 sqlite::memory:（embedded 专属），
# 无 sqlite 驱动组（postgres/mysql/duckdb）下必 panic，故门控至 embedded 组
required-features = ["permission", "sqlite"]

[[test]]
name = "core_permission_integration"
path = "tests/core/integration/permission_integration.rs"
required-features = ["permission", "cache", "test-utils", "permission-engine"]

[[test]]
name = "audit_integration"
path = "tests/audit/integration/audit_integration.rs"
required-features = ["audit"]

[[test]]
name = "audit_unit_tests"
path = "tests/audit/unit/audit_unit_tests.rs"
required-features = ["audit"]

[[test]]
name = "migration_integration"
path = "tests/migration/integration/integration.rs"
required-features = ["migration", "auto-migrate", "sqlite"]

[[test]]
name = "migration_auto_migrate"
path = "tests/migration/integration/auto_migrate.rs"
# sqlite：用例硬编码 sqlite::memory:（embedded 专属，同上）
required-features = ["auto-migrate", "sqlite"]

[[test]]
name = "migration_schema_macro"
path = "tests/migration/integration/schema_macro_test.rs"
required-features = ["macros", "migration", "sqlite"]

[[test]]
name = "migration_query_builder"
path = "tests/migration/integration/query_builder_test.rs"
required-features = ["macros", "migration", "sqlite"]

[[test]]
name = "migration_timestamps"
path = "tests/migration/integration/timestamps_test.rs"
required-features = ["macros", "migration", "sqlite"]

[[test]]
name = "migration_soft_delete"
path = "tests/migration/integration/soft_delete_test.rs"
required-features = ["macros", "migration", "sqlite"]

[[test]]
name = "migration_validation"
path = "tests/migration/integration/validation_test.rs"
required-features = ["macros", "migration", "sqlite", "validation"]

[[test]]
name = "migration_hooks"
path = "tests/migration/integration/hooks_test.rs"
required-features = ["macros", "migration", "sqlite"]

[[test]]
name = "repository_macro_test"
path = "tests/repository_macro_test.rs"
required-features = ["macros", "sqlite", "runtime-tokio-rustls", "sql-parser"]

[[test]]
name = "sharding_integration"
path = "tests/sharding/integration/sharding_integration.rs"
required-features = ["sharding"]

[[test]]
