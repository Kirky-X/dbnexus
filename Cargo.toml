[workspace]
members = [
    ".",
    "macros",
    "src/tools/cli",
    "examples",
]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.91"
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/Kirky-X/dbnexus"
documentation = "https://docs.rs/dbnexus"
keywords = ["database", "orm", "sea-orm", "sql"]
categories = ["database", "asynchronous"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"

# Database - 不包含数据库驱动，由各子包自行选择
sea-orm = { version = "2.0", default-features = false }

# Time
time = { version = "0.3", features = ["formatting", "parsing"] }

# Caching - 基于 oxcache 的缓存系统

# Internal packages
dbnexus-macros = { path = "macros", version = "0.5" }

# Validation（root + examples 共享）
validator = { version = "0.21", features = ["derive"] }

[workspace.lints.rust]

[workspace.lints.clippy]
# 允许测试中多次引用 common 模块
duplicate_mod = "allow"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package]
name = "dbnexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "An enterprise-grade database abstraction layer for Rust with built-in permission control and connection pooling"
# 禁用 examples 自动发现：examples/ 目录下存在独立的 dbnexus-examples crate（含自有 Cargo.toml），
# 其 src/*.rs 文件不应被主包自动识别为示例。所有示例由 dbnexus-examples 子 crate 独立管理。
autoexamples = false

[features]
# ⚠️ 驱动互斥（严格，无逃生门）：embedded（sqlite/duckdb）与 server-side（postgres/mysql）
# 任何混合（含 --all-features 全开）一律编译失败。多后端 crate 不适用 --all-features
# 验证（Cargo 无 feature 互斥语法），请按驱动分组启用 features 验证。
# Rule 6: default features 最小化 — 所有依赖通过显式 features 启用。
# 与 oxcache/inklog/sdforge 保持一致（default = []）。
# 使用者需显式启用 runtime + 数据库驱动 + 所需功能特性。
# CI 使用 `--no-default-features --features <db>,default-no-db,all-optional`。
default = []

# default without database driver — for CI matrix testing where
# the database backend is selected via --features <db>,default-no-db
# Provides a convenience aggregate for the common non-driver feature set.
default-no-db = [
    "runtime-tokio-rustls",
    "permission",
    "sql-parser",
    "macros",
    "config-env",
    "with-time",
]

# === 运行时 (互斥 - 必须且只能选一个) ===
runtime-tokio-rustls = [
    "sea-orm/runtime-tokio-rustls",
    "tokio/rt-multi-thread",
    "tokio/fs",
]
runtime-tokio-native-tls = [
    "sea-orm/runtime-tokio-native-tls",
    "tokio/rt-multi-thread",
    "tokio/fs",
]
runtime-async-std = [
    "sea-orm/runtime-async-std",
]

# === 数据库驱动 (互斥 - 必须且只能选一个) ===
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm/macros"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm/macros"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm/macros"]
duckdb = ["dep:duckdb"]  # 嵌入式分析型数据库（0.3.0 新增）
# Graph database drivers (can coexist with relational drivers per design 2.8)
ladybug = ["dep:lbug"]   # 嵌入式图数据库（Ladybug，原 Kuzu）
neo4j = ["dep:neo4rs"]   # Neo4j 图数据库服务器

# === 核心功能 (可选) ===
permission = ["dashmap", "futures", "yaml", "sql-parser", "arc-swap"]  # 权限控制（强制依赖 sql-parser 防止 SQL 注入绕过；dashmap 用于 access/permission，yaml 用于策略解析，futures 用于测试，arc-swap 用于无锁配置读取）
# Task 21：移除 permission-with-cache 聚合 feature（纯别名，无独占代码）
# 启用带缓存的权限控制请使用：permission + cache
sql-parser = ["sqlparser", "cache", "regex", "unicode-normalization"]
macros = ["dbnexus-macros"]
cache = ["dep:oxcache"]  # 缓存功能（基于 oxcache）

# trait-kit 0.4 AsyncKit integration (DbNexusModule). Pulls in trait-kit
# with the `async` feature only — default features are disabled (Rule 6).
# `oxcache-integration` enables the OxcacheDbCacheAdapter; `kit` adds the
# DbNexusModule that wires OxcacheModule's capability into a DbPool.
# Mirrors oxcache/limiteron `kit` feature pattern (Phase 2/3).
oxcache-integration = ["dep:oxcache"]
kit = ["dep:trait-kit", "oxcache-integration", "oxcache/kit", "trait-kit/lifecycle", "trait-kit/health", ]

# === 配置支持 ===
yaml = ["serde_yaml_ng"]  # YAML 配置支持（Task 21：合并原 config-yaml 别名）
config-toml = []  # TOML 配置支持（无额外依赖，用户需自行添加 toml crate）
config-env = []  # 环境变量配置（无额外依赖）
json = []  # JSON 支持（用于直接 serde_json 反序列化）

# === 连接池增强 ===
pool-health-check = ["futures"]  # 连接池健康检查
pool-warmup = ["futures"]  # 连接池预热

# === 可观测性 ===
observability = ["metrics", "health-check"]
metrics = ["dep:parking_lot"]  # Prometheus 格式 metrics 导出（parking_lot 用于 MetricsCollector 内部 RwLock）
health-check = []  # 健康检查模块（内置，无额外依赖）

# === 数据管理 ===
data-management = ["migration", "auto-migrate", "sharding", "global-index"]
migration = ["sqlparser", "regex"]  # 数据库迁移
auto-migrate = ["migration"]  # 自动迁移
sharding = ["twox-hash", "chrono", "futures", "dashmap"]  # 数据分片（dashmap 用于分片连接池并发管理）
global-index = ["chrono", "with-json"]  # 全局索引
with-json = ["sea-orm/with-json"]  # JSON 支持（global-index 需要）
with-time = ["sea-orm/with-time"]  # time crate 支持（timestamps 功能需要）
with-chrono = ["sea-orm/with-chrono", "chrono"]  # chrono 类型支持（DateTime/NaiveDateTime 字段）
with-uuid = ["sea-orm/with-uuid", "dep:uuid"]  # UUID 类型支持（uuid::Uuid 字段）
validation = ["validator", "with-time"]  # 数据验证（validator crate + timestamps 依赖）

# === 分布式能力 ===
retry = ["sql-parser", "dep:rand"]  # 运行时重试 + 指数退避（需要 sql-parser 判断幂等性，rand 用于 jitter）
failover = ["pool-health-check"]  # 连接故障转移（CircuitBreaker + HealthCheck 协同）
replica-routing = []  # 副本路由（基于复制 lag 检测的读写分离）
scatter-gather = ["sharding"]  # 跨分片查询引擎（scatter-gather 执行器）
shard-migration = ["migration", "sharding"]  # 分片迁移编排
saga = ["sharding", "dep:uuid"]  # 分布式事务 Saga 编排器
distributed-id = []  # 分布式 ID 生成器（Snowflake 默认实现）
distributed-capabilities = ["retry", "failover", "replica-routing", "scatter-gather", "shard-migration", "saga", "distributed-id"]  # 分布式能力聚合 feature

# === 安全与合规 ===
security = ["audit", "permission-engine"]
audit = ["chrono", "dep:uuid"]  # 审计日志
permission-engine = ["dashmap", "cache", "futures", "regex", "permission"]  # 高级权限引擎（依赖 permission 提供基础权限类型）
authentication = ["jsonwebtoken", "bcrypt"]  # JWT 认证系统

# === 开发工具 ===
dev = []
dev-full = ["dev", "bench", "test-utils"]
bench = ["criterion"]  # 性能测试相关依赖
test-utils = ["tempfile", "assert_cmd"]  # 测试辅助工具
cli-tests = []

# === 预设配置 ===
# 嵌入式/边缘设备 - 超轻量配置
embedded = ["runtime-tokio-rustls", "sqlite", "config-env"]

# 微服务 - 优化的配置
microservice = [
    "runtime-tokio-rustls",
    "postgres",
    "permission",
    "sql-parser",
    "config-env",
    "observability",
]

# 单体应用 - 完整配置
monolith = [
    "runtime-tokio-rustls",
    "postgres",
    "permission",
    "sql-parser",
    "yaml",
    "data-management",
    "security",
    "observability",
    "retry",
    "failover",
    "replica-routing",
    "scatter-gather",
    "shard-migration",
    "saga",
    "distributed-id",
]

# 企业级 - 全功能配置
enterprise = ["postgres", "monolith", "permission-engine"]

# 所有可选功能（不包括数据库驱动）
all-optional = ["cache", "observability", "data-management", "security", "migration", "retry", "failover", "replica-routing", "scatter-gather", "shard-migration", "saga", "distributed-id"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
serde_json = { workspace = true }
sea-orm = { workspace = true, default-features = false }
time = { workspace = true }
parking_lot = { version = "0.12", optional = true }
chrono = { version = "0.4", optional = true, features = ["serde"] }
twox-hash = { version = "2.1", optional = true }
url = "2.5"
async-trait = "0.1"
uuid = { version = "1.23", optional = true, features = ["v4"] }
validator = { workspace = true, optional = true }
criterion = { version = "0.8", optional = true }

# External dependencies
regex = { version = "1.0", optional = true }
sqlparser = { version = "0.62", optional = true }
futures = { version = "0.3", optional = true }
dashmap = { version = "6.2", optional = true }
# Lock-free read for permission config (COW pattern)
arc-swap = { version = "1.7", optional = true }
# Lock-free connection pool queue (crossbeam-deque)
crossbeam-deque = { version = "0.8", optional = true }
# Cache via oxcache - moka is used internally by oxcache as L1 backend.
oxcache = { path = "../oxcache", version = "0.4", optional = true }

# trait-kit integration (optional, feature-gated via `kit`).
# Mirrors oxcache/limiteron pattern (Phase 2/3 of trait-kit-async-integration).
trait-kit = { path = "../trait-kit", features = ["async"], optional = true, default-features = false }

# DuckDB embedded database (duckdb feature, 0.3.0 new)
duckdb = { version = "1.1", optional = true, features = ["bundled"] }

# Ladybug embedded graph database (ladybug feature, 0.4.0 new)
lbug = { version = "0.19", optional = true }
# Neo4j graph database server (neo4j feature, 0.4.0 new)
neo4rs = { version = "0.8", optional = true }

# Authentication dependencies
# jsonwebtoken: v11 使用 aws_lc_rs 后端，API 与 v10 兼容
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"], optional = true }
bcrypt = { version = "0.19", optional = true }

unicode-normalization = { version = "0.1", optional = true }
rand = { version = "0.10", optional = true }

# ICU4X 国际化（核心特性，始终可用）
icu = "2.2"
writeable = "0.6"
sys-locale = "0.3"
fluent-bundle = "0.16"
unic-langid = "0.9"


# Internal packages
dbnexus-macros = { workspace = true, optional = true }

# Testing utilities (also in dev-dependencies)
assert_cmd = { version = "2.2", optional = true }
tempfile = { version = "3.27", optional = true }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
criterion = "0.8"
tempfile = "3.27"
futures = "0.3"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

