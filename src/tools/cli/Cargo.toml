[package]
name = "dbnexus-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository = "https://github.com/Kirky-X/dbnexus"
homepage = "https://github.com/Kirky-X/dbnexus"
documentation = "https://docs.rs/dbnexus-cli"
keywords = ["database", "orm", "sea-orm", "sql"]
categories = ["database", "asynchronous"]
description = "DBNexus CLI tool for database migration and management"

[[bin]]
name = "dbnexus-cli"
path = "src/main.rs"

# 数据库驱动（互斥：必须且只能选一个）：cargo run --features sqlite|postgres|mysql
[features]
default = ["sqlite", "migration", "all-optional", "health-check", "audit", "sharding", "permission-engine"]
sqlite = ["dbnexus/sqlite"]
postgres = ["dbnexus/postgres"]
mysql = ["dbnexus/mysql"]

sql-parser = ["dbnexus/sql-parser"]
permission = ["dbnexus/permission"]
config-env = ["dbnexus/config-env"]
audit = ["dbnexus/audit", "dbnexus/sql-parser"]
metrics = ["dbnexus/metrics"]
health-check = ["dbnexus/health-check"]
sharding = ["dbnexus/sharding"]
permission-engine = ["dbnexus/permission-engine"]
migration = ["dbnexus/migration", "dbnexus/auto-migrate", "dbnexus/runtime-tokio-rustls", "dbnexus/permission", "dbnexus/cache"]
all-optional = ["dbnexus/all-optional"]
# 完整驱动组合（server-side 驱动用户按 Cargo.toml 注释途径启用）：驱动 + 全部可选能力
postgres-full = ["postgres", "all-optional", "dbnexus/runtime-tokio-rustls"]
mysql-full = ["mysql", "all-optional", "dbnexus/runtime-tokio-rustls"]

[dependencies]
dbnexus = { version = "0.6.0-rc.10", path = "../../..", default-features = false }
sea-orm = { workspace = true, default-features = false, features = ["runtime-tokio-rustls"] }
clap = { version = "4.6", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "derive", "env"] }
tokio = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = { version = "2.5", default-features = false, features = ["std"] }
serde_json = { workspace = true }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
assert_cmd = { version = "2.2", default-features = false, features = ["color", "color-auto"] }
predicates = { version = "3.1", default-features = false, features = ["diff", "regex", "float-cmp", "normalize-line-endings", "color"] }
tempfile = { version = "3.27", default-features = false }

[lints]
workspace = true
