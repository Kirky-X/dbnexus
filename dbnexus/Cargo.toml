[package]
name = "dbnexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "An enterprise-grade database abstraction layer for Rust with built-in permission control and connection pooling"

[features]
default = ["runtime-tokio-rustls"]

# Async runtime (互斥)
runtime-tokio-rustls = [
    "sea-orm/runtime-tokio-rustls",
    "tokio/rt-multi-thread",
]
runtime-tokio-native-tls = [
    "sea-orm/runtime-tokio-native-tls",
    "tokio/rt-multi-thread",
]
runtime-async-std = [
    "sea-orm/runtime-async-std",
]

# Database drivers (互斥 - 必须且只能选一个)
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm/macros", "sea-orm/with-json"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm/macros", "sea-orm/with-json"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm/macros", "sea-orm/with-json"]

# Optional features
metrics = ["dep:prometheus"]
migration = []
auto-migrate = ["migration"]
sharding = ["dep:twox-hash", "dep:chrono"]
global-index = ["dep:sha2", "dep:async-trait", "dep:chrono"]
cache = ["dep:async-trait", "dep:uuid", "dep:indexmap"]
audit = ["dep:chrono", "dep:uuid", "dep:async-trait"]
permission-engine = ["dep:async-trait"]
tracing = [
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-jaeger",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:chrono",
    "dep:http",
    "dep:tower",
    "dep:once_cell",
]
confers = ["dep:confers"]

# Development features
dev = []
cli-tests = []

# 启用所有可选功能（不包括数据库特性，因为数据库特性互斥）
all-optional = ["metrics", "migration", "auto-migrate", "tracing", "sharding", "global-index", "cache", "audit", "permission-engine", "confers"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
prometheus = { workspace = true, optional = true }
toml = "0.9.10"
parking_lot = "0.12"
lru = { workspace = true }
home = "0.5"
chrono = { version = "0.4", optional = true, features = ["serde"] }
http = { version = "1.0", optional = true }
tower = { version = "0.5", optional = true }
tracing-opentelemetry = { version = "0.27", optional = true }
opentelemetry = { version = "0.24", optional = true }
opentelemetry-otlp = { version = "0.17", optional = true }
opentelemetry-jaeger = { version = "0.22", optional = true }
opentelemetry_sdk = { version = "0.24", optional = true }
once_cell = { version = "1.20", optional = true }
twox-hash = { version = "2.1", optional = true }
sha2 = { version = "0.10", optional = true }
async-trait = { version = "0.1", optional = true }
uuid = { version = "1.0", optional = true, features = ["v4"] }
indexmap = { version = "2.0", optional = true }
confers = { version = "0.1", optional = true, default-features = false }

# External dependencies
regex = "1.0"
sqlparser = "0.47"
rand = "0.8"
futures = "0.3"
dashmap = "5.5"

# Internal dependencies
dbnexus-macros.workspace = true

tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

[dev-dependencies]
tokio-test = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.10"
criterion = "0.5"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
indexmap = "2.0"
twox-hash = "2.1"
sha2 = "0.10"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "core_config_integration"
path = "tests/core/config_integration.rs"
required-features = []

[[test]]
name = "core_entity_integration"
path = "tests/core/entity_integration.rs"
required-features = []

[[test]]
name = "core_sql_parser_integration"
path = "tests/core/sql_parser_integration.rs"
required-features = []

[[test]]
name = "core_pool_integration"
path = "tests/core/pool_integration.rs"
required-features = []

[[test]]
name = "core_session_transaction"
path = "tests/core/session_transaction.rs"
required-features = []

[[test]]
name = "core_permission_integration"
path = "tests/core/permission_integration.rs"
required-features = []

[[test]]
name = "audit_integration"
path = "tests/audit/integration.rs"
required-features = ["audit"]

[[test]]
name = "cache_integration"
path = "tests/cache/integration.rs"
required-features = ["cache"]

[[test]]
name = "migration_integration"
path = "tests/migration/integration.rs"
required-features = ["migration"]

[[test]]
name = "migration_auto_migrate"
path = "tests/migration/auto_migrate.rs"
required-features = ["auto-migrate"]

[[test]]
name = "sharding_integration"
path = "tests/sharding/integration.rs"
required-features = ["sharding"]

[[test]]
name = "global_index_integration"
path = "tests/global_index/integration.rs"
required-features = ["global-index"]

[[test]]
name = "metrics_integration"
path = "tests/metrics/integration.rs"
required-features = ["metrics"]

[[test]]
name = "tracing_integration"
path = "tests/tracing/integration.rs"
required-features = ["tracing"]

[[test]]
name = "permission_engine_integration"
path = "tests/permission_engine/integration.rs"
required-features = ["permission-engine"]

[[test]]
name = "cross_cutting_benchmarks"
path = "tests/cross_cutting/benchmarks.rs"
required-features = []

[[test]]
name = "cross_cutting_cli"
path = "tests/cross_cutting/cli.rs"
required-features = ["cli-tests"]

[[test]]
name = "cross_cutting_concurrency"
path = "tests/cross_cutting/concurrency.rs"
required-features = []

[[test]]
name = "cross_cutting_multi_db"
path = "tests/cross_cutting/multi_db.rs"
required-features = ["migration"]
