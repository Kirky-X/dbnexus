# =============================================================================
# DB Nexus Pre-commit Configuration
# =============================================================================
# 此配置文件定义了代码提交前需要运行的检查项
# 安装方法: scripts/install-pre-commit.sh
# =============================================================================

repos:
  # =============================================================================
  # Rust 代码格式化检查
  # =============================================================================
  - repo: https://github.com/rust-lang/rustfmt
    rev: stable
    hooks:
      - id: rustfmt
        name: Rust Format Check
        description: 检查 Rust 代码是否正确格式化
        entry: cargo fmt -- --check
        language: system
        pass_filenames: false
        types: [rust]

  # =============================================================================
  # Rust 代码质量检查 (Clippy)
  # =============================================================================
  - repo: https://github.com/rust-lang/rust-clippy
    rev: stable
    hooks:
      - id: clippy
        name: Rust Clippy Check
        description: 检查 Rust 代码质量问题，将警告视为错误
        entry: bash -c 'RUSTFLAGS="--cap-lints=allow" cargo clippy --all-targets --features sqlite --workspace -- -D warnings'
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]

  # =============================================================================
  # Rust 编译检查
  # =============================================================================
  - repo: local
    hooks:
      - id: cargo-check
        name: Cargo Check
        description: 检查 Rust 代码是否可以编译
        entry: bash scripts/pre-commit-check.sh cargo_check
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]

      - id: cargo-build
        name: Cargo Build
        description: 检查 Rust 代码是否可以成功构建
        entry: bash scripts/pre-commit-check.sh cargo_build
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]

  # =============================================================================
  # YAML 语法检查
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Remove Trailing Whitespace
        description: 去除行尾空白字符
        args: ['--markdown-linebreak-ext=md']
        types: [text]

      - id: check-yaml
        name: Check YAML Syntax
        description: 检查 YAML 文件语法
        args: ['--unsafe']  # 允许自定义标签

      - id: check-toml
        name: Check TOML Syntax
        description: 检查 TOML 文件语法
        files: \.toml$

      - id: check-merge-conflict
        name: Check Merge Conflict Markers
        description: 检测文件中的合并冲突标记

      - id: check-added-large-files
        name: Check Added Large Files
        description: 检测是否添加了超过 1MB 的文件
        args: ['--maxkb=1024']

  # =============================================================================
  # Shell 脚本语法检查
  # =============================================================================
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.9.0
    hooks:
      - id: shellcheck
        name: Shell Script Syntax Check
        description: 检查 Shell 脚本语法
        files: \.sh$
        types: [shell]

# =============================================================================
# 排除的目录和文件
# =============================================================================
exclude: |
  (?x)^(
    target/|
    \.git/|
    \.cargo/|
    \.rustc/|
    coverage/|
    \.tarpaulin/|
    \.htmlcov/|
    \.DS_Store|
    \.idea/|
    \.vscode/|
    \.trae/|
    \.env.*|
    docker-compose.*\.yml|
    docs/(prd|task|tdd|test|uat)\.md|
    temp/|
    tmp/|
    \.gitignore|
    \.pre-commit-config\.yaml|
    \.clang-format|
    \.editorconfig|
    \*.swp|
    \*.swo|
    \*~
    \*.orig|
    \*.rej|
    \*.bak|
    \*.log|
    openspec/|
    \.iflow/|
    \.serena/|
    \.claude/
  )

# =============================================================================
# Git Hook 设置
# =============================================================================
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# =============================================================================
# 回退行为和并行设置
# =============================================================================
fail_fast: false
verbose: true
