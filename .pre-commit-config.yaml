# pre-commit 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# 安装: pip install pre-commit && pre-commit install --install-hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # --baseline: 本仓 .secrets.baseline 记录已知误报(示例/测试中的演示凭据),
        # 仅新增真实密钥才报警
        args: [--baseline, .secrets.baseline, --exclude-files, tests/, --exclude-files, examples/]
        exclude: '^Cargo\.lock$'

  - repo: https://github.com/crate-ci/typos
    rev: v1.28.0
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Format Rust code
        description: Run rustfmt on Rust files
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        # 零告警门槛 feature 组合(与 CI lint job 一致);dbnexus 驱动互斥,不可 --all-features
        entry: cargo check --no-default-features --features sqlite,default-no-db,all-optional --workspace --exclude dbnexus-examples --exclude dbnexus-macros
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        # 零告警门槛 feature 组合(与 CI clippy job 一致);dbnexus 驱动互斥,不可 --all-features
        entry: cargo clippy --all-targets --no-default-features --features sqlite,default-no-db,all-optional --workspace --exclude dbnexus-examples --exclude dbnexus-macros -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
