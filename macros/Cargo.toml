[package]
name = "dbnexus-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Procedural macros for dbnexus"

[lib]
proc-macro = true

[dependencies]
# Proc macro dependencies
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
regex = "1.0"

[dev-dependencies]
trybuild = "1.0"
dbnexus = { path = "..", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "permission", "sql-parser", "cache", "yaml"] }
sea-orm = { workspace = true, default-features = false, features = ["macros"] }

[lints]
workspace = true
